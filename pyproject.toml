# GitHubSync 元数据：不提供全局命令（GITHUBSYNC_REPO 环境变量仅 github_sync.bat 层读写）
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "githubsync"
version = "3.0.0"
description = "CLI-first GitHub sync tool: see, decide, act, done"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["cli*", "core*", "tui*"]
